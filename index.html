<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Điều khiển xe cứu hộ</title>
  <!-- Thư viện MQTT qua WebSocket để kết nối xuyên mạng -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    h1 { color: #38bdf8; font-size: 22px; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 1.5px; text-align: center; }
    
    .status-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 8px 15px; text-align: center; margin-bottom: 20px; width: 100%; max-width: 320px; font-size: 13px; font-weight: bold; }
    .status-disconnected { color: #ef4444; }
    .status-connected { color: #4ade80; }

    .dpad-container { background: #1e293b; padding: 20px; border-radius: 30px; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(3, 85px); grid-template-rows: repeat(3, 85px); gap: 12px; }
    .btn { background: #334155; border: none; border-radius: 18px; color: #f8fafc; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.05s ease; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    .btn:active, .btn.active { background: #38bdf8; color: #0f172a; transform: scale(0.92); box-shadow: 0 0 15px #38bdf8; }
    .btn-stop { background: #ef4444; color: #fff; grid-column: 2; grid-row: 2; border-radius: 50%; font-size: 13px; font-weight: 800; }
    .btn-stop:active { background: #dc2626; box-shadow: 0 0 15px #ef4444; }
    #btnF { grid-column: 2; grid-row: 1; } #btnL { grid-column: 1; grid-row: 2; }
    #btnR { grid-column: 3; grid-row: 2; } #btnB { grid-column: 2; grid-row: 3; }

    .servo-panel { background: #1e293b; padding: 15px 20px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 10px 20px rgba(0,0,0,0.3); width: 100%; max-width: 320px; margin-top: 20px; }
    .servo-row { width: 100%; margin-bottom: 10px; }
    .servo-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: #94a3b8; font-weight: bold; }
    input[type=range] { -webkit-appearance: none; width: 100%; background: #334155; height: 10px; border-radius: 5px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #38bdf8; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Robot Controller</h1>
  
  <div class="status-card">
    Trạng thái: <span id="mqtt_status" class="status-disconnected">Đang kết nối...</span>
  </div>

  <div class="dpad-container">
    <div class="grid">
      <button class="btn" id="btnF">▲</button>
      <button class="btn" id="btnL">◄</button>
      <button class="btn btn-stop" id="btnS">STOP</button>
      <button class="btn" id="btnR">►</button>
      <button class="btn" id="btnB">▼</button>
    </div>
  </div>

  <div class="servo-panel">
    <h3 style="margin: 0 0 10px 0; color: #f8fafc; font-size: 15px; text-align: center;">Cánh tay Robot</h3>
    <div class="servo-row">
      <div class="servo-label"><span>Đế</span><span id="v_base">90°</span></div>
      <input type="range" min="0" max="180" value="90" oninput="sendServo('base', this.value)">
    </div>
    <div class="servo-row">
      <div class="servo-label"><span>Cánh tay 1</span><span id="v_shoulder">90°</span></div>
      <input type="range" min="0" max="180" value="90" oninput="sendServo('shoulder', this.value)">
    </div>
    <div class="servo-row">
      <div class="servo-label"><span>Cánh tay 2</span><span id="v_elbow">90°</span></div>
      <input type="range" min="0" max="180" value="90" oninput="sendServo('elbow', this.value)">
    </div>
    <div class="servo-row">
      <div class="servo-label"><span>Cánh tay gắp</span><span id="v_gripper">90°</span></div>
      <input type="range" min="0" max="180" value="90" oninput="sendServo('gripper', this.value)">
    </div>
  </div>

  <script>
    let brokerHost = "broker.hivemq.com";
    let brokerPort = 8000;
    let clientId = "WebClient-" + Math.random().toString(16).substring(2, 9);
    
    let client = new Paho.MQTT.Client(brokerHost, Number(brokerPort), clientId);

    client.onConnectionLost = function (responseObject) {
      let st = document.getElementById("mqtt_status");
      st.innerText = "Mất kết nối!";
      st.className = "status-disconnected";
      setTimeout(MQTTconnect, 3000);
    };

    function MQTTconnect() {
      let st = document.getElementById("mqtt_status");
      st.innerText = "Đang kết nối...";
      client.connect({ onSuccess: onConnect, onFailure: onFailure });
    }

    function onConnect() {
      let st = document.getElementById("mqtt_status");
      st.innerText = "Đã kết nối (Online)";
      st.className = "status-connected";
    }

    function onFailure(message) {
      let st = document.getElementById("mqtt_status");
      st.innerText = "Kết nối thất bại";
      st.className = "status-disconnected";
      setTimeout(MQTTconnect, 3000);
    }

    MQTTconnect();

    function sendMQTT(topic, payload) {
      if (client.isConnected()) {
        let message = new Paho.MQTT.Message(payload);
        message.destinationName = topic;
        client.send(message);
      }
    }

    let holdInterval = null;
    let activeCmd = 'stop';

    function send(cmd) {
      let valStr = "0,0";
      if (cmd === 'forward') valStr = "2000,0";
      else if (cmd === 'backward') valStr = "-2000,0";
      else if (cmd === 'left') valStr = "0,-2000";
      else if (cmd === 'right') valStr = "0,2000";
      else if (cmd === 'stop') valStr = "0,0";
      
      sendMQTT("robot/joystick_cmd", valStr);
    }

    function sendServo(joint, val) {
      document.getElementById('v_' + joint).innerText = val + '°';
      sendMQTT("robot/servo_cmd", joint + "," + val);
    }

    function pressBtn(cmd, id) {
      if(activeCmd === cmd) return;
      activeCmd = cmd;
      document.getElementById(id)?.classList.add('active');
      send(cmd);
      if (holdInterval) clearInterval(holdInterval);
      holdInterval = setInterval(() => { send(cmd); }, 300);
    }

    function releaseBtn() {
      if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
      activeCmd = 'stop';
      send('stop');
      ['btnF','btnB','btnL','btnR'].forEach(id => document.getElementById(id)?.classList.remove('active'));
    }

    const bind = (id, cmd) => {
      let el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); pressBtn(cmd, id); }, {passive: false});
      el.addEventListener('touchend', (e) => { e.preventDefault(); releaseBtn(); }, {passive: false});
      el.addEventListener('mousedown', () => pressBtn(cmd, id));
      el.addEventListener('mouseup', releaseBtn);
      el.addEventListener('mouseleave', releaseBtn);
    };

    bind('btnF', 'forward'); bind('btnB', 'backward'); bind('btnL', 'left'); bind('btnR', 'right');
    document.getElementById('btnS').onclick = releaseBtn;
  </script>
</body>
</html>
