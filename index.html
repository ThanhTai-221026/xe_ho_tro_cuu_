<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Control Center (4G)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .speed-card { background: #1e293b; padding: 15px 30px; border-radius: 20px; text-align: center; margin-bottom: 20px; }
    .speed-val { font-size: 48px; color: #4ade80; font-family: monospace; }
    .grid { display: grid; grid-template-columns: repeat(3, 85px); grid-template-rows: repeat(3, 85px); gap: 12px; }
    .btn { background: #334155; border: none; border-radius: 18px; color: #fff; font-size: 26px; }
    .btn:active, .btn.active { background: #38bdf8; color: #0f172a; }
    .btn-stop { background: #ef4444; grid-column: 2; grid-row: 2; font-size: 13px; font-weight: bold; }
    #btnF { grid-column: 2; grid-row: 1; } #btnL { grid-column: 1; grid-row: 2; }
    #btnR { grid-column: 3; grid-row: 2; } #btnB { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>
  <div class="speed-card">
    <div class="speed-val" id="speed">0.0</div>
    <div>Tốc độ (km/h)</div>
  </div>
  <div class="grid">
    <button class="btn" id="btnF">▲</button>
    <button class="btn" id="btnL">◄</button>
    <button class="btn btn-stop" id="btnS">STOP</button>
    <button class="btn" id="btnR">►</button>
    <button class="btn" id="btnB">▼</button>
  </div>

  <script>
    // Kết nối MQTT qua WebSocket
    const client = new Paho.MQTT.Client("broker.hivemq.com", 8000, "WebClient-" + Math.random());
    client.connect({ onSuccess: () => {
      client.subscribe("robot/telemetry");
    }});

    client.onMessageArrived = (msg) => {
      if (msg.destinationName === "robot/telemetry") {
        document.getElementById('speed').innerText = parseFloat(msg.payloadString).toFixed(1);
      }
    };

    function sendCmd(x, y) {
      if (client.isConnected()) {
        const message = new Paho.MQTT.Message(`${x},${y}`);
        message.destinationName = "robot/joystick_cmd";
        client.send(message);
      }
    }

    let holdInterval = null;
    function press(x, y, id) {
      document.getElementById(id)?.classList.add('active');
      sendCmd(x, y);
      if (holdInterval) clearInterval(holdInterval);
      holdInterval = setInterval(() => sendCmd(x, y), 300);
    }

    function release() {
      if (holdInterval) clearInterval(holdInterval);
      sendCmd(0, 0);
      ['btnF','btnB','btnL','btnR'].forEach(i => document.getElementById(i)?.classList.remove('active'));
    }

    const bind = (id, x, y) => {
      let el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); press(x, y, id); });
      el.addEventListener('touchend', release);
      el.addEventListener('mousedown', () => press(x, y, id));
      el.addEventListener('mouseup', release);
    };

    bind('btnF', 2000, 0); bind('btnB', -2000, 0);
    bind('btnL', 0, -2000); bind('btnR', 0, 2000);
    document.getElementById('btnS').onclick = release;
  </script>
</body>
</html>
